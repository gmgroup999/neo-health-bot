services:
  neo-health-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: neo-health-bot
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DB_PATH=/app/data/neo-health.db
    ports:
      - "127.0.0.1:3098:3000"   # healthz → localhost only
    volumes:
      - neo-health-data:/app/data   # SQLite persistent storage
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  neo-health-data:
    driver: local
