name: Deploy to Z Node

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy files to Z Node
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: "src/,Dockerfile,docker-compose.yml,package.json,package-lock.json,tsconfig.json,.env.example"
          target: /home/jack/neo-health-bot
          rm: false
          timeout: 30s
          command_timeout: 2m

      - name: Deploy on Z Node
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          connect_timeout: 30s
          command_timeout: 5m
          script: |
            cd ~/neo-health-bot
            docker compose up -d --build
            docker image prune -f
            echo "✅ Deploy complete — $(date)"
            docker ps --filter name=neo-health-bot --format "table {{.Names}}\t{{.Status}}"
